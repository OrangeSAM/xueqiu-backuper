<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深夜研报 — 雪球帖子浏览器</title>
<style>
:root {
  --ink: #111110;
  --ink-surface: #1c1a18;
  --ink-raised: #24221f;
  --ink-border: #2d2a26;
  --ink-border-light: #36322c;
  --paper: #e6ddd0;
  --paper-muted: #9d9688;
  --paper-dim: #6b6559;
  --amber: #c8964a;
  --amber-light: #d4a853;
  --amber-muted: #7d623b;
  --amber-glow: rgba(200, 150, 74, 0.08);
  --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-ui);
  background: var(--ink);
  color: var(--paper);
  height: 100vh;
  display: flex;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: ""; position: fixed; inset: 0; z-index: 9999;
  pointer-events: none; opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat; background-size: 200px 200px;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-border-light); }
::selection { background: var(--amber-muted); color: var(--paper); }

/* ---- Sidebar ---- */
#sidebar {
  width: 340px; min-width: 340px;
  background: var(--ink-surface);
  border-right: 1px solid var(--ink-border);
  display: flex; flex-direction: column;
}
#sidebar-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--ink-border);
}
#sidebar-header h1 {
  font-size: 13px; font-weight: 600; letter-spacing: 0.05em;
  color: var(--amber); margin-bottom: 12px;
}
#search-wrap { position: relative; }
#search-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--paper-dim);
}
#search {
  width: 100%; padding: 8px 12px 8px 34px; font-size: 13px;
  background: var(--ink); border: 1px solid var(--ink-border-light);
  border-radius: 6px; color: var(--paper); outline: none;
  font-family: var(--font-ui); transition: border-color .2s, box-shadow .2s;
}
#search:focus {
  border-color: var(--amber-muted);
  box-shadow: 0 0 0 3px var(--amber-glow);
}
#search-stats { font-size: 11px; color: var(--paper-dim); margin-top: 10px; }

#post-list { flex: 1; overflow-y: auto; }

.post-item {
  padding: 12px 20px; border-bottom: 1px solid var(--ink-border);
  cursor: pointer; transition: background .15s; animation: fadeIn .35s ease both;
  position: relative;
}
.post-item:hover { background: rgba(255,255,255,0.015); }
.post-item.active {
  background: linear-gradient(90deg, rgba(200,150,74,0.06) 0%, transparent 100%);
  border-left: 3px solid var(--amber); padding-left: 17px;
}
.post-item-title {
  font-size: 13px; font-weight: 500; line-height: 1.5;
  color: var(--paper-muted); display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px; letter-spacing: 0.01em;
}
.post-item.active .post-item-title { color: var(--paper); }
.post-item-meta {
  display: flex; gap: 12px; font-size: 11px; color: var(--paper-dim);
}
.post-item.active .post-item-meta { color: var(--amber-muted); }
.post-item-meta span { display: flex; align-items: center; gap: 3px; }
.post-item-meta svg { width: 11px; height: 11px; }

/* ---- Main ---- */
#main { flex: 1; overflow-y: auto; }
#empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 16px;
  color: var(--paper-dim); font-size: 14px;
}
#empty-state svg { width: 48px; height: 48px; opacity: 0.4; }

.article-wrap {
  max-width: 720px; margin: 0 auto; padding: 32px 40px;
  animation: fadeIn .3s ease;
}

.art-title {
  font-size: 1.65rem; font-weight: 700; color: var(--paper);
  line-height: 1.4; margin-bottom: 16px; letter-spacing: 0.015em;
}
.art-rule { width: 48px; height: 2px; background: var(--amber-muted); margin-bottom: 20px; }

.art-meta-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 32px; flex-wrap: wrap; gap: 8px;
}
.art-meta {
  display: flex; gap: 16px; font-size: 12px; color: var(--paper-dim);
  flex-wrap: wrap;
}
.art-meta span { display: flex; align-items: center; gap: 4px; }
.art-meta svg { width: 12px; height: 12px; }

#refresh-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; font-size: 12px; font-family: var(--font-ui);
  background: transparent; border: 1px solid var(--ink-border-light);
  border-radius: 6px; color: var(--paper-muted); cursor: pointer;
  transition: all .2s;
}
#refresh-btn:hover { border-color: var(--amber-muted); color: var(--amber); }
#refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
#refresh-btn .spin { animation: spin 1s linear infinite; }

.art-body {
  font-family: var(--font-body); font-size: 1.0625rem;
  line-height: 1.85; color: var(--paper); white-space: pre-wrap;
  word-break: break-word; margin-bottom: 40px;
}

#comments-section { border-top: 1px solid var(--ink-border); padding-top: 32px; margin-top: 16px; }
#comments-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
}
#comments-header h2 {
  font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
  color: var(--amber);
}
#comments-header .badge {
  font-size: 11px; padding: 2px 10px; border-radius: 99px;
  background: var(--ink-raised); color: var(--paper-dim);
}

/* ---- Comments ---- */
.comment-thread { }
.comment-thread.nested {
  margin-left: 20px; padding-left: 16px;
  border-left: 2px solid var(--amber-muted);
}
.comment-thread.nested .comment-thread.nested { border-color: var(--ink-border-light); }
.comment-thread.nested .comment-thread.nested .comment-thread.nested { border-color: var(--ink-border); }

.comment-item {
  padding: 14px 0; border-bottom: 1px solid rgba(45, 42, 38, 0.6);
}
.comment-item:last-child { border-bottom: none; }

.comment-header {
  display: flex; justify-content: space-between; align-items: flex-start;
}
.comment-user-row { display: flex; align-items: center; gap: 8px; }
.comment-avatar {
  width: 20px; height: 20px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; flex-shrink: 0;
}
.comment-name { font-size: 13px; font-weight: 600; color: var(--paper); }
.comment-time { font-size: 11px; color: var(--paper-dim); flex-shrink: 0; margin-left: 8px; }

.author-badge {
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  background: var(--amber-glow); color: var(--amber-light);
  font-weight: 500; flex-shrink: 0;
}

.comment-text {
  font-size: 14px; line-height: 1.7; color: var(--paper-muted);
  white-space: pre-wrap; word-break: break-word; margin-top: 6px;
}
.comment-text a { color: var(--amber); text-decoration: none; }
.comment-text a:hover { text-decoration: underline; }

.comment-footer { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--paper-dim); }
.comment-footer .like-count { display: flex; align-items: center; gap: 3px; }
.comment-footer svg { width: 11px; height: 11px; }
.comment-footer .toggle-replies {
  display: flex; align-items: center; gap: 3px; cursor: pointer;
  color: var(--amber-muted); background: none; border: none;
  font-size: 11px; font-family: var(--font-ui); padding: 0;
  transition: opacity .2s;
}
.comment-footer .toggle-replies:hover { opacity: 0.8; }
.comment-footer .toggle-replies svg { transition: transform .2s; }
.comment-footer .toggle-replies.collapsed svg { transform: rotate(-90deg); }

/* ---- Loading ---- */
#loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 12px; color: var(--paper-dim); font-size: 14px;
}
.spinner {
  width: 32px; height: 32px; border: 2px solid var(--ink-border-light);
  border-top-color: var(--amber); border-radius: 50%; animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <h1>深夜研报</h1>
    <div id="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="search" placeholder="搜索帖子...">
    </div>
    <div id="search-stats"></div>
  </div>
  <div id="post-list"></div>
</aside>

<main id="main">
  <div id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
    </svg>
    <span>← 选择一篇帖子阅读</span>
  </div>
</main>

<script>
let posts = [];
let activeId = null;
const AUTHOR_NAME = "待到秋来九月八";

function fmtDate(ts) {
  const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtFull(ts) {
  const d = new Date(ts);
  return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function avatarColor(uid) {
  return `hsl(${(uid*31)%360}, 12%, 18%)`;
}

function stripHtml(s) {
  return (s||'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
}

// ---- Load ----
async function loadPosts(q) {
  const url = q ? '/api/posts?q='+encodeURIComponent(q) : '/api/posts';
  const resp = await fetch(url);
  posts = await resp.json();
  renderList();
}

function renderList() {
  const el = document.getElementById('post-list');
  const stats = document.getElementById('search-stats');
  stats.textContent = '共 '+posts.length+' 篇帖子';

  el.innerHTML = posts.map((p, i) => {
    const active = p.id === activeId;
    return `<div class="post-item${active ? ' active' : ''}" data-id="${p.id}" style="animation-delay:${Math.min(i*15,300)}ms">
      <div class="post-item-title">${esc(p.title||'(无标题)')}</div>
      <div class="post-item-meta">
        <span>${fmtDate(p.created_at)}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/></svg>${p.like_count}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>${p.fav_count}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${p.comment_count}</span>
      </div>
    </div>`;
  }).join('');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---- Post detail ----
async function selectPost(id) {
  activeId = id;
  renderList();
  const main = document.getElementById('main');
  main.innerHTML = '<div id="loading"><div class="spinner"></div><span>加载中...</span></div>';

  try {
    const resp = await fetch('/api/posts/'+id);
    const data = await resp.json();
    renderArticle(data);
  } catch(e) {
    main.innerHTML = '<div style="color:#f85149;padding:40px;text-align:center">加载失败</div>';
  }
}

function renderArticle(data) {
  const s = data.status;
  const title = stripHtml(s.title||s.description||'(无标题)');
  const text = data.article_text||stripHtml(s.description||'')||'(无内容)';
  const comments = data.comments||[];

  let html = `<div class="article-wrap">
    <h1 class="art-title">${esc(title)}</h1>
    <div class="art-rule"></div>
    <div class="art-meta-row">
      <div class="art-meta">
        <span>${fmtFull(s.created_at)}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/></svg>${s.like_count??0}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>${s.fav_count??0}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>${s.retweet_count??0}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${comments.length}</span>
        ${s.source ? '<span style="background:var(--ink-raised);padding:2px 6px;border-radius:3px;font-size:10px">'+esc(s.source)+'</span>' : ''}
      </div>
      <button id="refresh-btn" onclick="refreshPost(${s.id})">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="refresh-icon"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span id="refresh-label">刷新数据</span>
      </button>
    </div>
    <div class="art-body">${esc(text)}</div>`;

  if (comments.length > 0) {
    html += `<div id="comments-section">
      <div id="comments-header"><h2>评论</h2><span class="badge">${comments.length}</span></div>
      ${renderComments(comments)}
    </div>`;
  }

  html += '</div>';
  document.getElementById('main').innerHTML = html;
  document.getElementById('main').scrollTop = 0;
}

function renderComments(comments, depth) {
  depth = depth || 0;
  return comments.map(c => {
    const text = c.text||c.description||'';
    const children = c.child_comments||[];
    const hasChildren = Array.isArray(children) && children.length>0;
    const nestedClass = depth>0 ? ' nested' : '';
    const id = 'c-'+c.id;

    let html = `<div class="comment-thread${nestedClass}" id="${id}">
      <div class="comment-item">
        <div class="comment-header">
          <div class="comment-user-row">
            <div class="comment-avatar" style="background:${avatarColor(c.user_id)};color:var(--paper-muted)">${esc(c.screen_name.charAt(0))}</div>
            <span class="comment-name">${esc(c.screen_name)}</span>
            ${c.screen_name===AUTHOR_NAME ? '<span class="author-badge">作者</span>' : ''}
          </div>
          <span class="comment-time">${fmtFull(c.created_at)}</span>
        </div>
        <div class="comment-text">${formatCommentText(text)}</div>
        <div class="comment-footer">
          ${c.like_count>0 ? '<span class="like-count"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'+c.like_count+'</span>' : ''}
          ${hasChildren ? '<button class="toggle-replies" onclick="toggleReplies(\''+id+'\')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>收起回复</button>' : ''}
        </div>
      </div>`;

    if (hasChildren) {
      html += `<div class="child-replies">${renderComments(children, depth+1)}</div>`;
    }

    html += '</div>';
    return html;
  }).join('');
}

function formatCommentText(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\$([^(]+)\(([^)]+)\)/g,
      '<a href="https://xueqiu.com/S/$2" target="_blank" rel="noreferrer">$$1($2)</a>');
}

function toggleReplies(id) {
  const thread = document.getElementById(id);
  const child = thread.querySelector('.child-replies');
  const btn = thread.querySelector('.toggle-replies');
  if (!child || !btn) return;
  const isHidden = child.style.display === 'none';
  child.style.display = isHidden ? '' : 'none';
  btn.classList.toggle('collapsed', !isHidden);
  btn.innerHTML = (isHidden
    ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>收起回复'
    : '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>展开 '+child.querySelectorAll('.comment-item').length+' 条回复');
}

// ---- Refresh ----
async function refreshPost(id) {
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  const label = document.getElementById('refresh-label');
  if (!btn || btn.disabled) return;

  btn.disabled = true;
  icon.classList.add('spin');
  label.textContent = '刷新中...';

  try {
    const resp = await fetch('/api/posts/'+id+'/refresh', { method:'POST' });
    if (resp.ok) {
      const data = await resp.json();
      renderArticle(data);
      // Update sidebar counts
      const idx = posts.findIndex(p => p.id === id);
      if (idx >= 0) {
        posts[idx].like_count = data.status.like_count||0;
        posts[idx].fav_count = data.status.fav_count||0;
        posts[idx].comment_count = data.comments.length;
        renderList();
      }
    } else {
      const err = await resp.json();
      alert(err.error||'刷新失败，请确认 cookie 未过期');
    }
  } catch(e) {
    alert('刷新请求失败');
  } finally {
    btn.disabled = false;
    icon.classList.remove('spin');
    label.textContent = '刷新数据';
  }
}

// ---- Events ----
document.getElementById('post-list').addEventListener('click', e => {
  const item = e.target.closest('.post-item');
  if (item) selectPost(parseInt(item.dataset.id));
});

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadPosts(e.target.value.trim()), 200);
});

// ---- Init ----
loadPosts();
</script>
</body>
</html>
