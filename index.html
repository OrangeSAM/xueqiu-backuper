<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雪球备份</title>
<style>
:root {
  --ink: #111110;
  --ink-surface: #1c1a18;
  --ink-raised: #24221f;
  --ink-border: #2d2a26;
  --ink-border-light: #36322c;
  --paper: #e6ddd0;
  --paper-muted: #9d9688;
  --paper-dim: #6b6559;
  --amber: #c8964a;
  --amber-light: #d4a853;
  --amber-muted: #7d623b;
  --amber-glow: rgba(200, 150, 74, 0.08);
  --red: #e0556a;
  --green: #5a9e7c;
  --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
  --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-ui);
  background: var(--ink);
  color: var(--paper);
  height: 100vh;
  display: flex;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 9999;
  pointer-events: none; opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat; background-size: 200px 200px;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-border-light); }
::selection { background: var(--amber-muted); color: var(--paper); }

/* ---- Sidebar ---- */
#sidebar {
  width: 340px; min-width: 340px;
  background: var(--ink-surface);
  border-right: 1px solid var(--ink-border);
  display: flex; flex-direction: column;
}
#sidebar-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--ink-border);
}
#sidebar-header h1 {
  font-size: 13px; font-weight: 600; letter-spacing: 0.05em;
  color: var(--amber); margin-bottom: 12px;
}
#search-wrap { position: relative; }
#search-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--paper-dim);
}
#search {
  width: 100%; padding: 8px 12px 8px 34px; font-size: 13px;
  background: var(--ink); border: 1px solid var(--ink-border-light);
  border-radius: 6px; color: var(--paper); outline: none;
  font-family: var(--font-ui); transition: border-color .2s, box-shadow .2s;
}
#search:focus {
  border-color: var(--amber-muted);
  box-shadow: 0 0 0 3px var(--amber-glow);
}
#search-stats { font-size: 11px; color: var(--paper-dim); margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }

#user-filter {
  width: 100%; margin-top: 8px; padding: 6px 10px; font-size: 12px;
  font-family: var(--font-ui); background: var(--ink);
  border: 1px solid var(--ink-border-light); border-radius: 6px;
  color: var(--paper-muted); outline: none; cursor: pointer;
  transition: border-color .2s;
}
#user-filter:focus { border-color: var(--amber-muted); }

#post-list { flex: 1; overflow-y: auto; }

.post-item {
  padding: 12px 20px; border-bottom: 1px solid var(--ink-border);
  cursor: pointer; transition: background .15s; animation: fadeIn .35s ease both;
}
.post-item:hover { background: rgba(255,255,255,0.015); }
.post-item.active {
  background: linear-gradient(90deg, rgba(200,150,74,0.06) 0%, transparent 100%);
  border-left: 3px solid var(--amber); padding-left: 17px;
}
.post-item-title {
  font-size: 13px; font-weight: 500; line-height: 1.5;
  color: var(--paper-muted); display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px; letter-spacing: 0.01em;
}
.post-item.active .post-item-title { color: var(--paper); }
.post-item-meta {
  display: flex; gap: 12px; font-size: 11px; color: var(--paper-dim);
}
.post-item.active .post-item-meta { color: var(--amber-muted); }
.post-item-meta span { display: flex; align-items: center; gap: 3px; }
.post-item-meta svg { width: 11px; height: 11px; }

/* ---- Tabs ---- */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#tab-bar {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--ink-border);
  padding: 0 20px;
  background: var(--ink-surface);
  flex-shrink: 0;
}
.tab-btn {
  padding: 12px 20px; font-size: 13px; font-family: var(--font-ui);
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--paper-dim); cursor: pointer; transition: all .2s;
  margin-bottom: -1px; letter-spacing: 0.02em;
}
.tab-btn:hover { color: var(--paper-muted); }
.tab-btn.active {
  color: var(--amber);
  border-bottom-color: var(--amber);
}
#main-content {
  flex: 1; overflow-y: auto;
}

/* ---- Article View ---- */
#empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 16px;
  color: var(--paper-dim); font-size: 14px;
}
#empty-state svg { width: 48px; height: 48px; opacity: 0.4; }

.article-wrap {
  max-width: 720px; margin: 0 auto; padding: 32px 40px;
  animation: fadeIn .3s ease;
}
.art-title {
  font-size: 1.65rem; font-weight: 700; color: var(--paper);
  line-height: 1.4; margin-bottom: 16px; letter-spacing: 0.015em;
}
.art-rule { width: 48px; height: 2px; background: var(--amber-muted); margin-bottom: 20px; }
.art-meta-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 32px; flex-wrap: wrap; gap: 8px;
}
.art-meta { display: flex; gap: 16px; font-size: 12px; color: var(--paper-dim); flex-wrap: wrap; }
.art-meta span { display: flex; align-items: center; gap: 4px; }
.art-meta svg { width: 12px; height: 12px; }
#refresh-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; font-size: 12px; font-family: var(--font-ui);
  background: transparent; border: 1px solid var(--ink-border-light);
  border-radius: 6px; color: var(--paper-muted); cursor: pointer;
  transition: all .2s;
}
#refresh-btn:hover { border-color: var(--amber-muted); color: var(--amber); }
#refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
#refresh-btn .spin { animation: spin 1s linear infinite; }
.art-body {
  font-family: var(--font-body); font-size: 1.0625rem;
  line-height: 1.85; color: var(--paper); white-space: pre-wrap;
  word-break: break-word; margin-bottom: 40px;
}

/* ---- Comments ---- */
#comments-section { border-top: 1px solid var(--ink-border); padding-top: 32px; margin-top: 16px; }
#comments-header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
#comments-header h2 { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: var(--amber); }
#comments-header .badge { font-size: 11px; padding: 2px 10px; border-radius: 99px; background: var(--ink-raised); color: var(--paper-dim); }
.comment-thread.nested {
  margin-left: 20px; padding-left: 16px;
  border-left: 2px solid var(--amber-muted);
}
.comment-thread.nested .comment-thread.nested { border-color: var(--ink-border-light); }
.comment-thread.nested .comment-thread.nested .comment-thread.nested { border-color: var(--ink-border); }
.comment-item { padding: 14px 0; border-bottom: 1px solid rgba(45, 42, 38, 0.6); }
.comment-item:last-child { border-bottom: none; }
.comment-header { display: flex; justify-content: space-between; align-items: flex-start; }
.comment-user-row { display: flex; align-items: center; gap: 8px; }
.comment-avatar {
  width: 20px; height: 20px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; flex-shrink: 0;
}
.comment-name { font-size: 13px; font-weight: 600; color: var(--paper); }
.comment-time { font-size: 11px; color: var(--paper-dim); flex-shrink: 0; margin-left: 8px; }
.author-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--amber-glow); color: var(--amber-light); font-weight: 500; flex-shrink: 0; }
.comment-text { font-size: 14px; line-height: 1.7; color: var(--paper-muted); white-space: pre-wrap; word-break: break-word; margin-top: 6px; }
.comment-text a { color: var(--amber); text-decoration: none; }
.comment-text a:hover { text-decoration: underline; }
.comment-footer { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--paper-dim); }
.comment-footer .like-count { display: flex; align-items: center; gap: 3px; }
.comment-footer svg { width: 11px; height: 11px; }
.comment-footer .toggle-replies {
  display: flex; align-items: center; gap: 3px; cursor: pointer;
  color: var(--amber-muted); background: none; border: none;
  font-size: 11px; font-family: var(--font-ui); padding: 0;
  transition: opacity .2s;
}
.comment-footer .toggle-replies:hover { opacity: 0.8; }
.comment-footer .toggle-replies svg { transition: transform .2s; }
.comment-footer .toggle-replies.collapsed svg { transform: rotate(-90deg); }

/* ---- Settings / Dashboard shared ---- */
.page-wrap {
  max-width: 680px; margin: 0 auto; padding: 36px 40px;
  animation: fadeIn .3s ease;
}
.page-wrap h2 {
  font-size: 16px; font-weight: 600; color: var(--amber);
  margin-bottom: 24px; letter-spacing: 0.04em;
}
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 12px; color: var(--paper-dim);
  margin-bottom: 6px; font-weight: 500;
}
.form-group input, .form-group textarea {
  width: 100%; padding: 10px 12px; font-size: 13px; font-family: var(--font-mono);
  background: var(--ink); border: 1px solid var(--ink-border-light);
  border-radius: 6px; color: var(--paper); outline: none;
  transition: border-color .2s;
}
.form-group textarea { resize: vertical; min-height: 72px; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--amber-muted); }
.form-group .hint { font-size: 10px; color: var(--paper-dim); margin-top: 5px; line-height: 1.5; }
.form-actions { display: flex; gap: 10px; margin-top: 28px; }
.btn-primary {
  padding: 8px 22px; font-size: 13px; font-family: var(--font-ui);
  background: var(--amber-muted); border: 1px solid var(--amber-muted);
  border-radius: 6px; color: var(--paper); cursor: pointer;
  font-weight: 500; transition: all .2s;
}
.btn-primary:hover { background: var(--amber); border-color: var(--amber); }
.btn-secondary {
  padding: 8px 22px; font-size: 13px; font-family: var(--font-ui);
  background: transparent; border: 1px solid var(--ink-border-light);
  border-radius: 6px; color: var(--paper-dim); cursor: pointer;
  transition: all .2s;
}
.btn-secondary:hover { border-color: var(--paper-dim); color: var(--paper); }
.btn-danger {
  padding: 8px 22px; font-size: 13px; font-family: var(--font-ui);
  background: transparent; border: 1px solid rgba(224,85,106,0.4);
  border-radius: 6px; color: var(--red); cursor: pointer;
  transition: all .2s;
}
.btn-danger:hover { background: var(--red); color: #fff; border-color: var(--red); }

/* ---- Dashboard ---- */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 16px; margin-bottom: 32px;
}
.stat-card {
  background: var(--ink);
  border: 1px solid var(--ink-border);
  border-radius: 8px; padding: 18px;
}
.stat-card .stat-value {
  font-size: 28px; font-weight: 700; color: var(--amber);
  font-family: var(--font-mono);
}
.stat-card .stat-label {
  font-size: 11px; color: var(--paper-dim); margin-top: 4px;
}
.scrape-log-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.scrape-log-table th {
  text-align: left; padding: 8px 12px;
  color: var(--paper-dim); font-weight: 500;
  border-bottom: 1px solid var(--ink-border);
}
.scrape-log-table td {
  padding: 8px 12px; color: var(--paper-muted);
  border-bottom: 1px solid rgba(45,42,38,0.5);
}
.scrape-log-table .status-success { color: var(--green); }
.scrape-log-table .status-error { color: var(--red); }


/* ---- Loading ---- */
#loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 12px; color: var(--paper-dim); font-size: 14px;
}
.spinner {
  width: 32px; height: 32px; border: 2px solid var(--ink-border-light);
  border-top-color: var(--amber); border-radius: 50%; animation: spin 0.8s linear infinite;
}
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 10001;
  padding: 12px 20px; border-radius: 8px; font-size: 13px;
  animation: fadeIn .3s ease;
  background: var(--ink-raised); border: 1px solid var(--amber-muted);
  color: var(--paper);
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <h1>雪球备份</h1>
    <div id="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="search" placeholder="搜索帖子...">
    </div>
    <div id="search-stats"></div>
    <select id="user-filter"><option value="">全部用户</option></select>
  </div>
  <div id="post-list"></div>
</aside>

<main id="main">
  <nav id="tab-bar">
    <button class="tab-btn active" data-tab="browse">浏览</button>
    <button class="tab-btn" data-tab="dashboard">概况</button>
    <button class="tab-btn" data-tab="settings">设置</button>
  </nav>
  <div id="main-content">
    <!-- browse -->
    <div id="view-browse" class="view">
      <div id="browse-inner">
        <div id="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <span>← 选择一篇帖子阅读</span>
        </div>
      </div>
    </div>
    <!-- dashboard -->
    <div id="view-dashboard" class="view" style="display:none"></div>
    <!-- settings -->
    <div id="view-settings" class="view" style="display:none"></div>
  </div>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
